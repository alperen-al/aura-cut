[package]
name = "aura-cut"
version = "1.0.0"
description = "AURA CUT — Definasyon & Beslenme Takibi"
authors = ["Alp"]
edition = "2021"

[lib]
name = "aura_cut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Düşük RAM + küçük binary: tam LTO, tek codegen birimi, boyut optimizasyonu
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
incremental = false
